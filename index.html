<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <title>Hello WebXR!</title>

  <!-- three.js -->
  <script src="https://unpkg.com/three@0.126.0/build/three.js"></script>
  <script src="https://unpkg.com/three@0.126.0/examples/js/geometries/TextGeometry.js"></script>
  <script src="https://unpkg.com/three@0.126.0/examples/js/libs/helvetiker_regular.typeface.js"></script>
</head>
<body>

<!-- Starting an immersive WebXR session requires user interaction.
    We start this one with a simple button. -->
<button onclick="activateXR()">Start Hello WebXR</button>
<script>
let responseTextMesh;

async function activateXR() {
  // Add a canvas element and initialize a WebGL context that is compatible with WebXR.
  const canvas = document.createElement("canvas");
  document.body.appendChild(canvas);
  const gl = canvas.getContext("webgl", {xrCompatible: true});

  // Create a scene.
  const scene = new THREE.Scene();

  // The cube will have a different color on each side.
  const materials = [
    new THREE.MeshBasicMaterial({color: 0xff0000}),
    new THREE.MeshBasicMaterial({color: 0x0000ff}),
    new THREE.MeshBasicMaterial({color: 0x00ff00}),
    new THREE.MeshBasicMaterial({color: 0xff00ff}),
    new THREE.MeshBasicMaterial({color: 0x00ffff}),
    new THREE.MeshBasicMaterial({color: 0xffff00})
  ];

  // Create the cube and add it to the demo scene.
  const cube = new THREE.Mesh(new THREE.BoxBufferGeometry(0.2, 0.2, 0.2), materials);
  cube.position.set(1, 1, 1);
  scene.add(cube);

  // Add text mesh to display the response
  const fontLoader = new THREE.FontLoader();
  fontLoader.load('https://unpkg.com/three@0.126.0/examples/fonts/helvetiker_regular.typeface.json', function (font) {
    const textGeometry = new THREE.TextGeometry('Waiting for response...', {
      font: font,
      size: 0.05,
      height: 0.01,
      curveSegments: 12,
    });
    const textMaterial = new THREE.MeshBasicMaterial({color: 0xffffff});
    responseTextMesh = new THREE.Mesh(textGeometry, textMaterial);
    responseTextMesh.position.set(0, 0, -0.5);  // Position the text mesh in front of the camera
    scene.add(responseTextMesh);
  });

  // Set up the WebGLRenderer, which handles rendering to the session's base layer.
  const renderer = new THREE.WebGLRenderer({
    alpha: true,
    preserveDrawingBuffer: true,
    canvas: canvas,
    context: gl
  });
  renderer.autoClear = false;

  // The API directly updates the camera matrices.
  // Disable matrix auto updates so three.js doesn't attempt
  // to handle the matrices independently.
  const camera = new THREE.PerspectiveCamera();
  camera.matrixAutoUpdate = false;

  // Initialize a WebXR session using "immersive-ar".
  const session = await navigator.xr.requestSession("immersive-ar");
  session.updateRenderState({
    baseLayer: new XRWebGLLayer(session, gl)
  });

  // A 'local' reference space has a native origin that is located
  // near the viewer's position at the time the session was created.
  const referenceSpace = await session.requestReferenceSpace('local');

  // Create a render loop that allows us to draw on the AR view.
  const onXRFrame = (time, frame) => {
    // Queue up the next draw request.
    session.requestAnimationFrame(onXRFrame);

    // Bind the graphics framebuffer to the baseLayer's framebuffer
    gl.bindFramebuffer(gl.FRAMEBUFFER, session.renderState.baseLayer.framebuffer)

    // Retrieve the pose of the device.
    // XRFrame.getViewerPose can return null while the session attempts to establish tracking.
    const pose = frame.getViewerPose(referenceSpace);
    if (pose) {
      // In mobile AR, we only have one view.
      const view = pose.views[0];

      const viewport = session.renderState.baseLayer.getViewport(view);
      renderer.setSize(viewport.width, viewport.height)

      camera.matrix.fromArray(view.transform.matrix)
      camera.projectionMatrix.fromArray(view.projectionMatrix);
      camera.updateMatrixWorld(true);

      // Render the scene with THREE.WebGLRenderer.
      renderer.render(scene, camera)
    }
  }
  session.requestAnimationFrame(onXRFrame);

  
}
setInterval(captureFrame, 3000);
updateTextMesh("DFD");
async function captureFrame() {

    updateTextMesh("jkdjfkdf");
  const canvas = document.querySelector('canvas');
  
  canvas.toBlob(function(blob) {
    // Create a FormData object to send the image
    const formData = new FormData();
    formData.append("file", blob, `frame_${Date.now()}.png`);

    // Send the image to the API using fetch
    fetch('https://amber-vr-api.onrender.com/upload', {  // Replace with your API endpoint
      method: 'POST',
      body: formData,
    })
    .then(response => response.json())
    .then(data => {
      // Update the text mesh with the response
      const newText = data.message || JSON.stringify(data);
      updateTextMesh(newText);
    })
    .catch((error) => {
      console.error('Error:', error);
      updateTextMesh('Error fetching response');
    });
  }, 'image/png');
}

function updateTextMesh(text) {
  if (responseTextMesh) {
    // Remove the old text mesh and create a new one
    responseTextMesh.geometry.dispose();  // Clean up old geometry
    const newGeometry = new THREE.TextGeometry(text, {
      font: responseTextMesh.geometry.parameters.font,
      size: 0.05,
      height: 0.01,
      curveSegments: 12,
    });
    responseTextMesh.geometry = newGeometry;
  }
}
</script>
</body>
</html>
