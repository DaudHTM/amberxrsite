<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR AR Passthrough</title>
</head>
<style>
    #sup {
        display: none; /* Initially hidden */
    }
    #notsup {
        display: none; /* Initially hidden */
    }
</style>
<body>
    <div id="sup">WebXR is supported!</div>
    <div id="notsup">WebXR is not supported.</div>
    <button onclick="immersive()" id="startbut">Start passthrough</button>

    <script>
        console.log("DFs");
        const xr = navigator.xr;
        const supDiv = document.getElementById('sup');
        const notSupDiv = document.getElementById('notsup');
        const startButton = document.getElementById('startbut');
        
        function immersive(){
        
            if (navigator.xr) {
          // Checks to ensure that 'immersive-ar' mode is available, and only
          // enables the button if so.
          navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
            supDiv.style.display="block;";
          });

          navigator.xr.requestSession('inline').then(console.log("dfd"));
        }
    }
   

   
    </script>
</body>
</html>
