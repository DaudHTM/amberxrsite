<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR AR Passthrough</title>
</head>
<style>
    #sup {
        display: none; /* Initially hidden */
    }
    #notsup {
        display: none; /* Initially hidden */
    }
</style>
<body>
    <div id="sup">WebXR is supported!</div>
    <div id="notsup">WebXR is not supported.</div>
    <button onclick="onRequestSession()" id="startbut">Start passthrough</button>

    <script>
        console.log("DFs");
        const xr = navigator.xr;
        const supDiv = document.getElementById('sup');
        const notSupDiv = document.getElementById('notsup');
        const startButton = document.getElementById('startbut');
        
        function onRequestSession() {
        return navigator.xr.requestSession('immersive-ar')
          .then((session) => {
            xrButton.setSession(session);
            onSessionStarted(session);
          }).catch(err => {
            console.error('Error requesting session:', err);
          });
      }

      function onSessionStarted(session) {
        session.addEventListener('end', onSessionEnded);
        session.requestAnimationFrame(onXRFrame);
      }

      function onEndSession(session) {
        session.end();
      }

      function onSessionEnded() {
        xrButton.setSession(null);
      }

      function onXRFrame(t, frame) {
        session.requestAnimationFrame(onXRFrame);
      
    }
   

   
    </script>
</body>
</html>
