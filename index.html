<html>
  <head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1, user-scalable=no'>
    <meta name='mobile-web-app-capable' content='yes'>
    <meta name='apple-mobile-web-app-capable' content='yes'>
    <link rel='icon' type='image/png' sizes='32x32' href='favicon-32x32.png'>
    <link rel='icon' type='image/png' sizes='96x96' href='favicon-96x96.png'>
    <link rel='stylesheet' href='css/common.css'>

    <title>Immersive AR Session</title>
  </head>
  <body>
    <header>
      <details open>
        <summary>Immersive AR Session</summary>
        <p>
          This sample demonstrates how to use an 'immersive-ar' XRSession to
          present a passthrough AR experience. No additional content will be shown.
          <a class="back" href="./">Back</a>
        </p>
      </details>
    </header>
    <script type="module">
      // Import required modules
      import {QueryArgs} from './js/util/query-args.js';

      // If requested, use the polyfill to provide support for mobile devices
      // and devices which only support WebVR.
      import WebXRPolyfill from './js/third-party/webxr-polyfill/build/webxr-polyfill.module.js';
      if (QueryArgs.getBool('usePolyfill', true)) {
        let polyfill = new WebXRPolyfill();
      }

      // XR globals.
      let xrImmersiveRefSpace = null;

      function initXR() {
        if (navigator.xr) {
          // Request an 'immersive-ar' session
          navigator.xr.requestSession('immersive-ar').then(onSessionStarted);
        }
      }

      function onSessionStarted(session) {
        session.addEventListener('end', onSessionEnded);

        // Request the reference space for the session
        session.requestReferenceSpace('local').then((refSpace) => {
          xrImmersiveRefSpace = refSpace;
          session.requestAnimationFrame(onXRFrame);
        });
      }

      function onSessionEnded(event) {
        event.session.end();
      }

      // Called every time an XRSession requests that a new frame be drawn.
      function onXRFrame(t, frame) {
        let session = frame.session;

        // Continue the animation frame request
        session.requestAnimationFrame(onXRFrame);
      }

      // Start the XR application.
      initXR();
    </script>
  </body>
</html>
