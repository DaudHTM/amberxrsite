<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR AR Passthrough</title>
</head>
<style>
    #sup {
        display: none; /* Initially hidden */
    }
    #notsup {
        display: none; /* Initially hidden */
    }
</style>
<body>
    <div id="sup">WebXR is supported!</div>
    <div id="notsup">WebXR is not supported.</div>
    <button onclick="onRequestSession()" id="startbut">Start passthrough</button>

    <script>
        console.log("DFs");
        const xr = navigator.xr;
        const supDiv = document.getElementById('sup');
        const notSupDiv = document.getElementById('notsup');
        const startButton = document.getElementById('startbut');
        
       async function onRequestSession() {
        if (navigator.xr) {
                try {
                    const session = await navigator.xr.requestSession('immersive-ar');
                    // Set up the session here
                    console.log('AR session started:', session);
                } catch (err) {
                    console.error('Failed to start AR session:', err);
                }
            } else {
                console.error('WebXR not supported');
            }

        }
   

   
    </script>
</body>
</html>
