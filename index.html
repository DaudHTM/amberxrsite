<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR AR Passthrough</title>
  
</head>
<style>
    #sup {
        display: none; /* Initially hidden */
    }
    #notsup {
        display: none; /* Initially hidden */
    }
</style>


<body>
    <div id="sup">WebXR is supported!</div>
   <div id="notsup">WebXR is not supported.</div>
   <button onclick="immersive()" id="startbut">Start passthrough</button>




   <script>
    console.log("DFs")
    const xr = navigator.xr;
    
    const supDiv = document.getElementById('sup');
        const notSupDiv = document.getElementById('notsup');
    
    const startButton = document.getElementById('startbut');

    supportedAr = false;
    
    if (navigator.xr) {
      navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
        if (supported) {
   
          console.log("supported")
          supportedAr=true;
         
        }
        
      });
    } else {
      alert('WebXR not supported');
      console.log("notsupported")
      notSupDiv.style.display = 'block'; 
    }

    function immersive(){
        if(supportedAr){
            notSupDiv.style.display = 'hidden';
            supDiv.style.display = 'block';
            navigator.xr.requestSession('immersive-ar', {
                            requiredFeatures: ['dom-overlay', 'local-floor', 'hand-tracking'], // Add passthrough support
                        }).then(onSessionStarted).catch(err => {
                            console.error("Failed to start AR session", err);
                            supDiv.innerHTML="Failed ot immerse";
                        });
        }
        notSupDiv.style.display = 'block';
        supDiv.style.display = 'hidden';
    }

    function onSessionStarted(session) {
            // Set up your rendering context here
            console.log("Session started:", session);
            session.addEventListener('end', onSessionEnded);

            // Set up a render loop
            const gl = document.createElement('canvas').getContext('webgl', { xrCompatible: true });
            session.updateRenderState({ baseLayer: new XRWebGLLayer(session, gl) });

            session.requestReferenceSpace('local').then((refSpace) => {
                session.requestAnimationFrame((time, frame) => renderFrame(time, frame, refSpace));
            });
        }
        function renderFrame(time, frame, refSpace) {
            const session = frame.session;
            const pose = frame.getViewerPose(refSpace);

            if (pose) {
                const glLayer = session.renderState.baseLayer;
                gl.bindFramebuffer(gl.FRAMEBUFFER, glLayer.framebuffer);
                gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

                // Render your AR content here

                session.requestAnimationFrame((time, frame) => renderFrame(time, frame, refSpace));
            }
        }

        function onSessionEnded() {
            console.log("Session ended");
            // Handle session ending here
        }
    
    </script>
</body>
</html>
