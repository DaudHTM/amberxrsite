<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR AR Passthrough</title>
</head>
<style>
    #sup {
        display: none; /* Initially hidden */
    }
    #notsup {
        display: none; /* Initially hidden */
    }
</style>
<body>
    <div id="sup">WebXR is supported!</div>
    <div id="notsup">WebXR is not supported.</div>
    <button onclick="onRequestSession()" id="startbut">Start passthrough</button>

    <script>
        console.log("DFs");
        const xr = navigator.xr;
        const supDiv = document.getElementById('sup');
        const notSupDiv = document.getElementById('notsup');
        const startButton = document.getElementById('startbut');
        
const immersiveOK = await navigator.xr.isSessionSupported("immersive-ar");
if (immersiveOK) {
  supDiv.style.display="block;";

} else {
    notSupDiv.style.display="block;";
  // Create an inline session instead, or tell the user about the
  // incompatibility if inline is required
}



        async function onRequestSession() {
            const session = await navigator.xr.requestSession("immersive-ar");

        }

        function rea(){
            session.requestAnimationFrame(rea);
        }

        session.requestAnimationFrame(rea);

   

   
    </script>
</body>
</html>
